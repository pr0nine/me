apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: databasus
spec:
  serviceName: "databasus-svc"
  replicas: 1
  selector:
    matchLabels:
      app: databasus
  template:
    metadata:
      labels:
        app: databasus
    spec:
      containers:
      - name: databasus
        image: databasus/databasus:latest
        imagePullPolicy: Always # Ensures it actually pulls the latest image on restart
        ports:
        - containerPort: 4005
          name: db-port
        volumeMounts:
        - name: databasus-storage
          mountPath: /databasus-data # Change this to your database's actual data directory
  volumeClaimTemplates:
  - metadata:
      name: databasus-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "local-path" # Uncomment and change to your cluster's storage class if needed
      resources:
        requests:
          storage: 4Gi

